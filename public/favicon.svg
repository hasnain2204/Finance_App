<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PWS — Personal Wallet &amp; Spending">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pwsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b735c"/>
      <stop offset="50%" stop-color="#17634f"/>
      <stop offset="100%" stop-color="#0f4436"/>
    </linearGradient>
    
    <!-- Emblem Accent Gradient -->
    <linearGradient id="pwsAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7f0e3"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="pwsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#07241c" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- App Icon Base: Modern Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#pwsBg)"/>

  <!-- Subtle Rim Light Inner Border -->
  <rect x="4" y="4" width="504" height="504" rx="124" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Icon Emblem: Modern Geometric Finance Card + Upward Trend Arc -->
  <g filter="url(#pwsGlow)">
    <!-- Back Folio Layer -->
    <rect x="136" y="148" width="240" height="156" rx="28" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.4" stroke-width="6"/>

    <!-- Front Card / Wallet Body -->
    <rect x="116" y="192" width="280" height="176" rx="32" fill="url(#pwsAccent)"/>

    <!-- Upward Growth Dynamic Trend Swoosh -->
    <path d="M152 308 L224 246 L272 278 L348 206" fill="none" stroke="#17634f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Arrowhead on Growth Peak -->
    <path d="M322 206 H348 V232" fill="none" stroke="#17634f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Secure Coin / Token Clasp Badge -->
    <circle cx="344" cy="280" r="26" fill="#17634f"/>
    <circle cx="344" cy="280" r="16" fill="#ffffff"/>
    <circle cx="344" cy="280" r="7" fill="#17634f"/>
  </g>
</svg>
